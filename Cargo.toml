[package]
name = "pathtrace-rs"
version = "0.1.2"
edition = "2024"
description = "A Rust implementation of Peter Shirley's Ray Tracing in One Weekend ray tracer"
readme = "README.md"
repository = "https://github.com/bitshifter/pathtrace-rs"
license = "MIT OR Apache-2.0"
keywords = ["graphics", "path-tracer", "raytracer", "simd"]
categories = ["graphics", "rendering"]

[dependencies]
glam = "0.34"
rand = "0.10"
rand_xoshiro = "0.8"
rayon = "1"
# serde = "1"
# serde_derive = "1"
# serde_json = "1"
typed-arena = "2"

[dependencies.clap]
version = "4"
default-features = false
features = ["std", "help", "usage", "error-context", "suggestions"]

[dependencies.pixels]
version = "0.17"

[dependencies.winit]
version = "0.30"

[dependencies.image]
version = "0.25"
default-features = false
features = ["jpeg", "png"]

[features]
bench = []
core_intrinsics = []

[profile.dev]
opt-level = 3

[profile.release]
debug = true
# lto = true

# [patch.crates-io]
# glam = { path = "../glam-rs" }
